# Pontos Livelo por real de cada parceiro (0046) e precos do Carrefour Mercado para as
# casas com Livelo (0047). As campanhas duram um ou dois dias, entao roda de 3 em 3 horas;
# e leve (uma chamada a Livelo e uma busca no Carrefour por item da lista).
name: Pontos Livelo

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: livelo
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Atualizar pontos
        working-directory: promocoes/coletor
        run: uv run promocoes livelo

      # Carrefour como mais um mercado: so os itens da lista e os fixos das casas com Livelo.
      - name: Carrefour (preços para a Livelo)
        continue-on-error: true
        working-directory: promocoes/coletor
        run: |
          uv run promocoes coletar carrefour
          uv run promocoes fotos carrefour
          uv run promocoes publicar carrefour
