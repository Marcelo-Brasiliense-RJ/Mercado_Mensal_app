# Monitor de promocoes: coleta os encartes, le com IA gratuita, gera fotos e publica
# na aba Ofertas do app. Roda sozinho; tambem da para rodar na mao em Actions > Run workflow.
name: Monitor de promoções

on:
  schedule:
    - cron: "0 10 * * 1,4"   # segunda e quinta, 7h no Rio: todos os mercados
    - cron: "0 10 * * 3"     # quarta, 7h: so o Guanabara (encarte muda no meio da semana)
  workflow_dispatch:
    inputs:
      mercados:
        description: "Mercados (vazio = todos). Ex.: guanabara mundial"
        required: false
        default: ""

concurrency:
  group: promocoes
  cancel-in-progress: false

jobs:
  rodar:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # A URL nao e segredo e pode ficar em Variables; as chaves so em Secrets (Variables aparecem no log).
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || vars.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL || vars.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      # Cache da IA (a mesma pagina nunca e lida duas vezes) e historico de precos
      # (regra dos 50%) passam de uma rodada para a outra.
      - uses: actions/cache@v4
        with:
          path: promocoes/coletor/data
          key: promocoes-data-${{ github.run_id }}
          restore-keys: promocoes-data-

      - name: Conferir segredos
        run: |
          faltam=""
          for v in GEMINI_API_KEY OPENROUTER_API_KEY SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            [ -n "${!v}" ] || faltam="$faltam $v"
          done
          if [ -n "$faltam" ]; then
            echo "::error::Faltam em Settings > Secrets and variables > Actions > aba Secrets:$faltam"
            exit 1
          fi

      # Um passo por mercado: a lista de passos do run mostra o andamento ao vivo.
      # Quarta (Guanabara) e rodada manual com mercados escolhidos pulam os outros.
      - name: Escolher mercados
        id: m
        env:
          AGENDA: ${{ github.event.schedule }}
          MERCADOS: ${{ inputs.mercados }}
        run: |
          if [ "$AGENDA" = "0 10 * * 3" ]; then MERCADOS="guanabara"; fi
          echo "lista= ${MERCADOS:-superbom guanabara mundial supermarket} " >> "$GITHUB_OUTPUT"

      - name: Superbom
        id: superbom
        if: contains(steps.m.outputs.lista, ' superbom ')
        continue-on-error: true
        run: ./promocoes/rodar_semana.sh superbom

      - name: Guanabara
        id: guanabara
        if: contains(steps.m.outputs.lista, ' guanabara ')
        continue-on-error: true
        run: ./promocoes/rodar_semana.sh guanabara

      - name: Mundial
        id: mundial
        if: contains(steps.m.outputs.lista, ' mundial ')
        continue-on-error: true
        run: ./promocoes/rodar_semana.sh mundial

      - name: Supermarket
        id: supermarket
        if: contains(steps.m.outputs.lista, ' supermarket ')
        continue-on-error: true
        run: ./promocoes/rodar_semana.sh supermarket

      # Os mercados seguem mesmo se um falhar; no fim o run fica vermelho (e o GitHub
      # manda e-mail) se algum falhou.
      - name: Resultado
        if: always()
        run: |
          falhou=""
          [ "${{ steps.superbom.outcome }}" = "failure" ] && falhou="$falhou Superbom"
          [ "${{ steps.guanabara.outcome }}" = "failure" ] && falhou="$falhou Guanabara"
          [ "${{ steps.mundial.outcome }}" = "failure" ] && falhou="$falhou Mundial"
          [ "${{ steps.supermarket.outcome }}" = "failure" ] && falhou="$falhou Supermarket"
          if [ -n "$falhou" ]; then echo "::error::Falhou:$falhou"; exit 1; fi

      # Encartes vencidos so ocupam o cache.
      - name: Limpar encartes antigos
        if: always()
        run: find promocoes/coletor/data/encartes -mindepth 2 -maxdepth 2 -type d -mtime +21 -exec rm -rf {} + || true
