[project]
name = "promocoes"
version = "0.1.0"
description = "Monitor de promocoes dos supermercados de Curicica/Jacarepagua"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pypdfium2>=4.30",
    "pillow>=10",
]

[project.scripts]
promocoes = "promocoes.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promocoes"]
